name: Release

# Builds installers for a tag and attaches them to its GitHub release.
# Runs on tag push; a manual run can retry an unfinished draft, not replace
# signed artifacts that clients may already be downloading.
#
# Stable releases include a manual Windows installer and the macOS updater channel. Prereleases build isolated
# Preview apps and a Windows installer, never updater archives or latest.json.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs once, before the matrix. `gh release upload` needs the release to
  # already exist, and a fresh tag has none -- the v0.1.1 release only worked
  # because it was created by hand while the build was still running. Doing it
  # in its own job also avoids two matrix legs racing to create it.
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      preview: ${{ steps.policy.outputs.preview }}
      app: ${{ steps.app.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate release channel
        id: policy
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: node scripts/release-policy.mjs "$TAG" >> "$GITHUB_OUTPUT"
      - id: app
        env:
          PREVIEW: ${{ steps.policy.outputs.preview }}
        run: |
          if [ "$PREVIEW" = true ]; then echo 'name=Velo Preview' >> "$GITHUB_OUTPUT"; else echo 'name=Velo' >> "$GITHUB_OUTPUT"; fi

      - name: Create the release if it does not exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PREVIEW: ${{ steps.policy.outputs.preview }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::Release $TAG is already published; use a new version."
              exit 1
            fi
            echo "Resuming draft $TAG; leaving its notes alone."
            exit 0
          fi

          # Notes come from the changelog section matching the tag, so they
          # never have to be written twice.
          python3 - "$TAG" > notes.md <<'PY'
          import pathlib, re, sys

          version = sys.argv[1].lstrip("v")
          text = pathlib.Path("CHANGELOG.md").read_text()
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text,
              re.S | re.M,
          )
          if not match:
              sys.exit(f"No [{version}] section in CHANGELOG.md")
          print(match.group(1).strip())
          PY

          args=()
          if [ "$PREVIEW" = true ]; then
            cat .github/prerelease-footer.md >> notes.md
            args+=(--prerelease --latest=false)
          else
            cat .github/release-footer.md >> notes.md
          fi
          gh release create "$TAG" --verify-tag --draft \
            --title "Velo ${TAG#v}" --notes-file notes.md "${args[@]}"

  build:
    name: ${{ matrix.label }}
    needs: prepare
    strategy:
      # One architecture failing should not throw away an installer that did
      # build.
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macOS (Apple Silicon)
            target: aarch64-apple-darwin
            arch: aarch64
          # macos-13 was retired: jobs sat queued without ever being assigned
          # a runner. macos-15-intel is the current Intel image.
          - os: macos-15-intel
            label: macOS (Intel)
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      APP: src-tauri/target/${{ matrix.target }}/release/bundle/macos/${{ needs.prepare.outputs.app }}.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install build dependencies
        run: brew install mpv pkg-config cmake dylibbundler

      - run: npm ci

      # Only the .app: `tauri bundle --bundles dmg` cleans and regenerates the
      # .app first, which would throw away the dylib fixes below.
      - name: Build app bundle
        env:
          PREVIEW: ${{ needs.prepare.outputs.preview }}
        run: |
          args=()
          if [ "$PREVIEW" = true ]; then args+=(--config src-tauri/tauri.preview.conf.json); fi
          npm run tauri build -- --bundles app --target ${{ matrix.target }} "${args[@]}"

      # Velo links libmpv dynamically, so a plain build points at the build
      # machine's Homebrew prefix and cannot start anywhere else. Copy the
      # whole dependency graph into the bundle and rewrite the install names.
      - name: Bundle libmpv and its dependencies
        run: |
          set -euo pipefail
          dylibbundler --overwrite-dir --bundle-deps --no-codesign \
            --fix-file "$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -1)" \
            --dest-dir "$APP/Contents/Frameworks" \
            --install-path "@executable_path/../Frameworks/"

          # dylibbundler re-adds an rpath that Tauri already set, and dyld
          # refuses to load a binary carrying a duplicate LC_RPATH.
          for f in "$APP/Contents/MacOS/"* "$APP/Contents/Frameworks"/*.dylib; do
            while dup=$(otool -l "$f" | grep -A2 LC_RPATH | grep 'path ' \
                        | sed 's/^ *path //;s/ (offset.*//' | sort | uniq -d | head -1); \
                  [ -n "$dup" ]; do
              install_name_tool -delete_rpath "$dup" "$f" || break
            done
          done

          codesign --force --deep --sign - "$APP"

      - name: Verify the bundle is self-contained
        run: |
          set -euo pipefail
          leaks=0
          for f in "$APP/Contents/MacOS/"* "$APP/Contents/Frameworks"/*.dylib; do
            if otool -L "$f" | tail -n +2 \
               | grep -E '/opt/homebrew|/usr/local/(opt|Cellar)'; then
              echo "::error::$f still references a build-machine library"
              leaks=$((leaks + 1))
            fi
          done
          [ "$leaks" -eq 0 ] || exit 1
          echo "Bundled $(ls "$APP/Contents/Frameworks" | wc -l | tr -d ' ') libraries"

      # Built by hand rather than by the Tauri bundler, which would rebuild
      # the .app and undo the step above.
      - name: Package disk image
        run: |
          set -euo pipefail
          # Same source Tauri stamps into the app, so the file name cannot
          # drift from the version inside the bundle.
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          dmg="Velo_${version}_${{ matrix.arch }}.dmg"
          stage=$(mktemp -d)
          cp -R "$APP" "$stage/"
          ln -s /Applications "$stage/Applications"
          hdiutil create -volname Velo -srcfolder "$stage" -ov -format UDZO "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      # The updater must get exactly the final repaired/ad-hoc-signed app,
      # not Tauri's earlier bundle that still references Homebrew libraries.
      - name: Package and sign updater archive
        if: needs.prepare.outputs.preview == 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required for updater releases."
            exit 1
          fi
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          archive="Velo_${version}_${{ matrix.arch }}.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C "$(dirname "$APP")" "$(basename "$APP")"
          npm run tauri signer sign -- "$archive"
          test -s "$archive.sig"
          echo "UPDATER_ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Verify final archive signature against the app key
        if: needs.prepare.outputs.preview == 'false'
        run: VELO_UPDATE_ARCHIVE="$PWD/$UPDATER_ARCHIVE" cargo test --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --test update_signature

      # Updater signatures authenticate archives; they do not replace Apple
      # notarization. The existing first-launch warning still applies.
      - name: Attach to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          PREVIEW: ${{ needs.prepare.outputs.preview }}
        run: |
          shasum -a 256 "$DMG" > "$DMG.sha256"
          if [ "$PREVIEW" = true ]; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
          else
            gh release upload "$TAG" "$DMG" "$UPDATER_ARCHIVE" "$UPDATER_ARCHIVE.sig" --clobber
          fi

  windows:
    needs: prepare
    uses: ./.github/workflows/windows-preview.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
      preview: ${{ needs.prepare.outputs.preview == 'true' }}

  publish-preview:
    needs: [prepare, build, windows]
    if: needs.prepare.outputs.preview == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-preview-x64
          path: windows
      - name: Publish prerelease without stable-channel artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          mapfile -t assets < <(find windows -type f)
          gh release upload "$TAG" "${assets[@]}" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' > assets.txt
          ! grep -E 'latest\.json|\.sig$|\.app\.tar\.gz$' assets.txt
          test "$(grep -c '\.dmg$' assets.txt)" = 2
          test "$(grep -c '\.exe$' assets.txt)" = 1
          gh release edit "$TAG" --draft=false --prerelease --latest=false

  publish:
    name: Publish complete release
    needs: [prepare, build, windows]
    if: needs.prepare.outputs.preview == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: windows-stable-x64
          path: windows
      - name: Publish manifest and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          test "$TAG" = "v$version"
          shopt -s nullglob
          installers=(windows/*-setup.exe)
          checksums=(windows/*.sha256)
          test "${#installers[@]}" -eq 1
          test "${#checksums[@]}" -eq 1
          (cd windows && sha256sum -c *.sha256)
          gh release upload "$TAG" windows/* --clobber
          stage=$(mktemp -d)
          gh release download "$TAG" --pattern '*.app.tar.gz' --pattern '*.app.tar.gz.sig' --dir "$stage"
          gh release view "$TAG" --json body --jq .body > "$stage/notes.txt"
          node scripts/update-manifest.mjs "$version" "$stage" "$stage/latest.json" "$stage/notes.txt"
          gh release upload "$TAG" "$stage/latest.json" --clobber
          gh release edit "$TAG" --draft=false --latest
