name: Windows Preview
on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    env:
      GGML_NATIVE: 'OFF'
      GGML_AVX: 'OFF'
      GGML_AVX2: 'OFF'
      GGML_FMA: 'OFF'
      GGML_F16C: 'OFF'
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install pinned Vulkan SDK for Whisper GPU compute
        shell: pwsh
        run: |
          $version = '1.4.363.0'
          $installer = Join-Path $env:RUNNER_TEMP 'vulkan-sdk.exe'
          $sdk = Join-Path $env:RUNNER_TEMP "VulkanSDK-$version"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe" -OutFile $installer
          $expected = '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141'
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne $expected) {
            throw 'Vulkan SDK checksum mismatch'
          }
          # The Qt installer contains multiple archives; 7-Zip only extracts the tools.
          # Copy-only installation avoids changing the runner's registry or system PATH.
          $process = Start-Process -FilePath $installer -ArgumentList @('--root', "`"$sdk`"", '--accept-licenses', '--default-answer', '--confirm-command', 'install', 'copy_only=1') -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Vulkan SDK installer failed: $($process.ExitCode)" }
          foreach ($relative in @('Include/vulkan/vulkan.h', 'Lib/vulkan-1.lib', 'Bin/glslc.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $sdk $relative))) { throw "Vulkan SDK missing $relative" }
          }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $sdk 'Bin') | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Prepare pinned libmpv
        shell: pwsh
        run: ./scripts/setup-windows.ps1
      - name: Verify checksum rejection
        shell: pwsh
        run: |
          $bad = Join-Path $env:RUNNER_TEMP 'bad-mpv.7z'
          Set-Content $bad 'not an archive'
          try {
            ./scripts/setup-windows.ps1 -Archive $bad -VerifyOnly
            throw 'Corrupt archive was accepted'
          } catch {
            if ($_.Exception.Message -notmatch 'checksum mismatch') { throw }
          }
      - run: npm ci
      - run: npm run version:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: node --test (Get-ChildItem tests/release/*.check.mjs).FullName
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-fail-fast
      - name: Build isolated NSIS installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.preview.conf.json
      - name: Build local transcription benchmark
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --release --target x86_64-pc-windows-msvc --example transcription_bench
          if ($LASTEXITCODE -ne 0) { throw 'Transcription benchmark build failed' }
          $dest = 'src-tauri/target/transcription-benchmark'
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/examples/transcription_bench.exe $dest
          Copy-Item src-tauri/windows-deps/libmpv-2.dll,src-tauri/windows-deps/vulkan-1.dll,src-tauri/windows-deps/NOTICE.txt,src-tauri/windows-deps/provenance.json $dest
          Copy-Item LICENSE "$dest/VELO-LICENSE.txt"
          New-Item -ItemType Directory -Force "$dest/licenses" | Out-Null
          Copy-Item src-tauri/windows-deps/VulkanRT-License.txt,docs/licenses/mpv-LICENSE.GPL.txt,docs/licenses/mpv-Copyright.txt "$dest/licenses"
          @{ source_commit = '${{ github.event.pull_request.head.sha || github.sha }}'; build_commit = (git rev-parse HEAD); backend = 'Vulkan'; model = 'ggml-large-v3-turbo-q5_0.bin' } | ConvertTo-Json | Set-Content "$dest/build-info.json"
      - name: Install and launch with clean PATH
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = node scripts/prepare-windows-asset.mjs $installers[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Preparing release asset failed' }
          ./scripts/test-windows-installer.ps1 -Installer $installer
      - uses: actions/upload-artifact@v4
        with:
          name: windows-preview-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sha256
            src-tauri/windows-deps/provenance.json
            src-tauri/windows-deps/dependencies.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-transcription-benchmark-x64
          if-no-files-found: error
          path: src-tauri/target/transcription-benchmark/
