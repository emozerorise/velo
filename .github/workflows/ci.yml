name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Lint, Typecheck & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test

  rust:
    name: Rust Backend (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: macos-14
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install mpv pkg-config
      - name: Cargo Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      # Linking needs libmpv, which is installed above on macOS only. The
      # Windows runner has no libmpv package, so it is limited to the
      # check-only steps until Windows is genuinely supported and the crate
      # has Rust tests worth linking for.
      - name: Cargo Test
        if: runner.os == 'macOS'
        run: cargo test --manifest-path src-tauri/Cargo.toml
