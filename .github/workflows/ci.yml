name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Lint, Typecheck & Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # package.json, tauri.conf.json, Cargo.toml and Cargo.lock all carry the
      # version, and Tauri stamps the app from tauri.conf.json. They drifted
      # once; nothing else would catch it before a release went out.
      - run: npm run version:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: node --test tests/release/*.check.mjs

  rust:
    name: Rust Backend (${{ matrix.os }})
    strategy:
      matrix:
        include:
          - os: macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install mpv pkg-config cmake
      - name: Cargo Format Check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Cargo Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Windows linking/tests and installer smoke checks live in Windows Preview.
      - name: Cargo Test
        if: runner.os == 'macOS'
        run: cargo test --manifest-path src-tauri/Cargo.toml
