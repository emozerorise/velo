[package]
name = "velo"
version = "0.9.0-beta.2"
description = "Fast, lightweight open-source video player"
authors = ["Velo Contributors"]
edition = "2021"

[lib]
name = "velo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Synthetic native UI acceptance only; never enabled by normal/release builds.
dictation-qa = []
summary-evidence-qa = []

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
pkg-config = "0.3"

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["sync", "rt", "macros", "time"] }
parking_lot = "0.12"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
raw-window-handle = "0.6"
# whisper.cpp compiled into the binary, so a release needs no external tools.
whisper-rs = { version = "0.16", features = ["tracing_backend", "raw-api"] }
# Model download on first use. reqwest is already in the tree via Tauri.
reqwest = { version = "0.13", features = ["stream", "json"] }
futures-util = { version = "0.3", default-features = false }
rubato = { version = "=0.16.2", default-features = false }
# API keys stay in Keychain Services / Windows Credential Manager rather
# than joining the ordinary settings users attach to bug reports.
keyring = "4.2"
# Whitespace is not a word boundary in Thai; count quoted excerpts locally.
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }


# Each desktop platform compiles its GPU backend; whisper retains CPU fallback.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "=0.6.2"
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = { version = "=0.16.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power"
] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.3"
# The model download is async, so its test needs a runtime to run on.
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
