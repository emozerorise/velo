[package]
name = "velo"
version = "0.2.0"
description = "Fast, lightweight open-source video player"
authors = ["Velo Contributors"]
edition = "2021"

[lib]
name = "velo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
pkg-config = "0.3"

[dependencies]
tauri = { version = "2.0.0", features = ["macos-private-api"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["sync", "rt", "macros"] }
parking_lot = "0.12"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
raw-window-handle = "0.6"
# whisper.cpp compiled into the binary, so a release needs no external tools.
whisper-rs = "0.16"
# Model download on first use. reqwest is already in the tree via Tauri.
reqwest = { version = "0.13", features = ["stream"] }
futures-util = { version = "0.3", default-features = false }


# Metal gives the GPU path on Apple silicon; other platforms fall back to CPU.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power"
] }

[dev-dependencies]
# The model download is async, so its test needs a runtime to run on.
tokio = { version = "1.38", features = ["rt-multi-thread", "macros"] }
